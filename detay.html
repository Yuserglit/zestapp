<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Detay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f2f2f2;
    }
    .haber {
      display: none;
      padding: 20px;
    }
    .aktif {
      display: block;
    }
    .kapak {
      width: 100%;
      height: 200px;
      object-fit: cover;
      filter: brightness(0.8);
    }
    .baslik {
      font-size: 20px;
      background: #007bff;
      color: white;
      padding: 12px;
      margin-top: -5px;
    }
    .aciklama {
      padding: 12px;
      background: white;
      border-radius: 8px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

<div id="haber1" class="haber">
  <img src="https://raw.githubusercontent.com/Yuserglit/zestapp/main/web-app-manifest-512x512.png" class="kapak">
  <div class="baslik">Türkmenistan ve Özbekistan Liderleri Buluştu</div>
  <div class="aciklama">Bu görüşmede iki ülke arasındaki enerji, ticaret ve kültürel ilişkiler masaya yatırıldı.</div>
</div>

<div id="haber2" class="haber">
  <img src="https://raw.githubusercontent.com/Yuserglit/zestapp/main/web-app-manifest-512x512.png" class="kapak">
  <div class="baslik">Başkanlık Sarayı’nda Tarihi Zirve</div>
  <div class="aciklama">Liderler, bölgesel güvenlik konularında iş birliğini güçlendirme kararı aldı.</div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  if (id) {
    const aktifHaber = document.getElementById("haber" + id);
    if (aktifHaber) {
      aktifHaber.classList.add("aktif");
    }
  }
</script>

</body>
</html>
